# Streamlit configuration for PhishLens.
[server]
# Matches core.email_parser.MAX_EML_BYTES (5 MB). The server re-checks it anyway.
maxUploadSize = 5
enableXsrfProtection = true

[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
